name: test

on:
  push:
  pull_request:

jobs:
  test:
    # Ubuntu 22.04's ffmpeg is 4.4, the oldest reframekit works with and the
    # one the hosted service runs, Ubuntu 24.04's is 6.1, and ubuntu-latest
    # is the newest Ubuntu GitHub runs. Node.js 22 is the oldest it takes,
    # and Node.js 24 removes folders in other ways. The runners run as a
    # user who is not root, as the service does, so the tests of a folder
    # that takes no files and of a default ACL under umask 077 run.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04, ubuntu-22.04]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg acl && ffmpeg -version | head -1
      - run: npm test
