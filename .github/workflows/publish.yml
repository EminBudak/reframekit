name: Publish to npm

on:
  release:
    types: [created]

jobs:
  test:
    # The same tests as on every push, on Ubuntu 22.04's ffmpeg 4.4 (the
    # oldest reframekit works with, and the one the hosted service runs), on
    # Ubuntu 24.04's 6.1 and on ubuntu-latest's; nothing is published unless
    # all of them pass.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04, ubuntu-22.04]
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg acl && ffmpeg -version | head -1

      - name: Test
        run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install latest npm
        run: npm install -g npm@latest

      - name: Check the tag matches the version
        run: |
          version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME#v}" = "$version" || { echo "Release tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1; }
          skill="$(node -p "require('./skills/reframekit/scripts/lib/version')")"
          test "$skill" = "$version" || { echo "skills/reframekit/scripts/lib/version.js says $skill, package.json says $version"; exit 1; }
          for file in .claude-plugin/marketplace.json .codex-plugin/plugin.json plugin.json; do
            found="$(node -p "const m = require('./$file'); (m.plugins ? m.plugins[0] : m).version")"
            test "$found" = "$version" || { echo "$file says $found, package.json says $version"; exit 1; }
          done

      - name: Publish with provenance
        run: npm publish --provenance --access public
